config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  # WyCo additions (quality-gate rollout, 2026-09-27)
  "**/.next/**",
  "**/.expo/**",
  ".claude/**",
  "coverage/**",
  "docs/**",
]


test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

# Early returns (guard clauses) are the house style, so a "too many return
# statements" count is noise here. Complexity, duplication, boolean logic and
# nesting stay on.
[smells.return_statements]
enabled = false

[[source]]
name = "default"
default = true

# Quality-gate scope (WyCo Ways of Working Part 14): ESLint + Qlty's built-in
# smells only. TypeScript is covered by ESLint (typescript-eslint) and the TS
# smells engine; Qlty has no tsc plugin, so `tsc --noEmit` stays a local gate.
# Security is owned elsewhere (Semgrep own code, Snyk/Dependabot dependencies,
# gitleaks secrets via the Stop hook and CI), so Qlty's security plugins are off.

[[plugin]]
name = "eslint"
version = "9.39.4"
package_file = "package.json"
# eslint-config-next resolves next's bundled babel parser and typescript-eslint
# needs typescript, so both must be installed alongside eslint in Qlty's
# sandboxed tool directory.
package_filters = ["eslint", "next", "typescript"]
